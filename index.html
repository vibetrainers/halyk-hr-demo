те`]},{id:`vac-3`,point:`1.3`,heading:`Как оформить отпуск`,text:`Заявление подаётся в портале не позднее чем за 14 календарных дней до начала отпуска. Руководитель согласует заявку в течение 2 рабочих дней, затем вы подписываете заявление ЭЦП — приказ формируется автоматически. Бумажное заявление не требуется.`,keywords:[`оформить`,`заявление`,`подать`,`отпуск`,`как взять`,`рәсімдеу`,`өтініш`,`демалыс`]},{id:`vac-4`,point:`1.4`,heading:`Деление отпуска на части`,text:`По соглашению с руководителем отпуск можно разделить на части. Одна из частей должна быть не менее двух календарных недель.`,keywords:[`разделить`,`части`,`частями`,`отпуск`,`бөлу`]},{id:`vac-5`,point:`1.5`,heading:`Оплата отпускных`,text:`Отпускные выплачиваются не позднее чем за 3 календарных дня до начала отпуска. Расчёт виден в расчётном листе (доступен на корпоративном устройстве).`,keywords:[`отпускные`,`оплата`,`выплата`,`когда заплатят`,`деньги`,`төлем`]},{id:`vac-6`,point:`1.6`,heading:`Болезнь во время отпуска и отзыв из отпуска`,text:`Если вы заболели во время отпуска, отпуск продлевается на дни нетрудоспособности или переносится по вашему заявлению. Отзыв из отпуска возможен только с вашего согласия.`,keywords:[`болезнь в отпуске`,`продлить отпуск`,`отозвать из отпуска`]}]},{id:`social`,code:`ВНД-HR-02`,title:`Порядок предоставления социальных отпусков и отпусков без сохранения заработной платы`,owner:os,version:`2026-02-10`,access:`all`,status:`active`,sections:[{id:`soc-1`,point:`2.1`,heading:`Отпуск без сохранения заработной платы`,text:`Банк обязан предоставить отпуск без сохранения заработной платы до 5 календарных дней при регистрации брака, рождении ребёнка, смерти близких родственников. В остальных случаях — по соглашению с руководителем.`,keywords:[`без сохранения`,`за свой счет`,`свадьба`,`брак`,`похороны`,`смерть`,`рождение`,`жалақысыз`]},{id:`soc-2`,point:`2.2`,heading:`Отпуск по беременности и родам`,text:`Отпуск по беременности и родам составляет 126 календарных дней (70 до родов и 56 после). При осложнённых родах — 140 дней, при рождении двух и более детей — 170 дней. Основание — лист временной нетрудоспособности.`,keywords:[`декрет`,`беременность`,`роды`,`декретный`,`жүктілік`,`босану`]},{id:`soc-3`,point:`2.3`,heading:`Отпуск по уходу за ребёнком`,text:`Отпуск по уходу за ребёнком без сохранения заработной платы предоставляется до достижения ребёнком трёх лет по заявлению одного из родителей. Социальные выплаты назначаются по законодательству РК — HR-партнёр поможет собрать документы.`,keywords:[`уход за ребенком`,`ребенок`,`декрет`,`три года`,`бала күтіміне`]},{id:`soc-4`,point:`2.4`,heading:`Что сделать при рождении ребёнка`,text:`1) Сообщите руководителю. 2) При необходимости оформите отпуск без сохранения до 5 дней. 3) Данные о ребёнке подтягиваются из eGov — справку приносить не нужно. 4) Добавьте ребёнка в ДМС по корпоративному тарифу. 5) Подайте заявление на материальную помощь по Положению о социальной поддержке.`,keywords:[`родился`,`рождение`,`ребенок`,`дети`,`малыш`,`бала`,`туылды`]}]},{id:`sick`,code:`ВНД-HR-03`,title:`Порядок оформления временной нетрудоспособности`,owner:os,version:`2025-11-20`,access:`all`,status:`active`,sections:[{id:`sick-1`,point:`3.1`,heading:`Если вы заболели`,text:`В первый день болезни сообщите руководителю любым удобным способом и отметьте больничный в портале («Сервисы → Больничный»). Это нужно, чтобы коллеги знали о вашем отсутствии.`,keywords:[`заболел`,`болею`,`больничный`,`больничного`,`болезнь`,`температура`,`ауырып`,`ауру`]},{id:`sick-2`,point:`3.2`,heading:`Электронный больничный лист`,text:`Лист временной нетрудоспособности оформляет медицинская организация в электронном виде. Он поступает в HR-систему автоматически — бумажный лист приносить не нужно.`,keywords:[`больничный лист`,`электронный`,`принести`,`больничный`,`парақ`]},{id:`sick-3`,point:`3.3`,heading:`Оплата больничного`,text:`Пособие по временной нетрудоспособности начисляется в ближайшую выплату заработной платы после закрытия больничного листа.`,keywords:[`оплата больничного`,`пособие`,`сколько платят`,`больничный`]}]},{id:`cert`,code:`ВНД-HR-04`,title:`Регламент выдачи справок и копий кадровых документов`,owner:os,version:`2026-01-15`,access:`all`,status:`active`,sections:[{id:`cert-1`,point:`4.1`,heading:`Какие справки можно заказать`,text:`Справка с места работы, справка о доходах, справка для визы (на английском языке), справка о стаже, копия трудового договора и выписка из приказа.`,keywords:[`справка`,`справку`,`с места работы`,`виза`,`стаж`,`копия`,`анықтама`]},{id:`cert-2`,point:`4.2`,heading:`Сроки выдачи`,text:`Электронная справка с QR-кодом формируется в портале за 1 минуту и принимается госорганами и банками. Бумажная справка с печатью готовится до 3 рабочих дней и выдаётся в HR-отделе вашего филиала.`,keywords:[`срок`,`когда будет`,`сколько ждать`,`справка`,`qr`,`печать`]},{id:`cert-3`,point:`4.3`,heading:`Справка о доходах`,text:`Справка о доходах содержит сведения о заработной плате, поэтому скачать её можно только на корпоративном устройстве. С телефона её можно заказать — файл придёт в корпоративную почту.`,keywords:[`справка о доходах`,`зарплата`,`доход`,`кредит`,`жалақы`,`табыс`]}]},{id:`trip`,code:`ВНД-HR-05`,title:`Положение о служебных командировках`,owner:`Административный департамент`,version:`2025-09-01`,access:`all`,status:`review`,sections:[{id:`trip-1`,point:`5.1`,heading:`Оформление командировки`,text:`Заявка на командировку подаётся в портале не позднее чем за 5 рабочих дней: цель, город, даты. Согласует руководитель, билеты и гостиницу бронирует административная служба.`,keywords:[`командировка`,`командировку`,`поездка`,`билеты`,`гостиница`,`іссапар`]},{id:`trip-2`,point:`5.2`,heading:`Суточные и проживание`,text:`Суточные и расходы на проживание возмещаются по нормам Приложения 1 к Положению. Суточные перечисляются на зарплатную карту до начала поездки.`,keywords:[`суточные`,`проживание`,`возмещение`,`командировочные`]},{id:`trip-3`,point:`5.3`,heading:`Авансовый отчёт`,text:`В течение 3 рабочих дней после возвращения загрузите фото чеков и посадочных талонов в портал — авансовый отчёт сформируется автоматически.`,keywords:[`отчет`,`авансовый`,`чеки`,`после командировки`]}]},{id:`dms`,code:`ВНД-HR-06`,title:`Программа добровольного медицинского страхования (ДМС)`,owner:os,version:`2026-01-01`,access:`all`,status:`active`,sections:[{id:`dms-1`,point:`6.1`,heading:`Кто застрахован`,text:`ДМС действует для всех сотрудников после окончания испытательного срока. Супруга (супруга) и детей можно подключить за свой счёт по корпоративному тарифу через портал.`,keywords:[`дмс`,`страховка`,`медстраховка`,`страхование`,`полис`,`сақтандыру`]},{id:`dms-2`,point:`6.2`,heading:`Как получить медицинскую помощь`,text:`Позвоните в круглосуточный контакт-центр страховой компании или запишитесь через её приложение, назвав номер полиса из портала. Направления в клиники-партнёры выдаются в день обращения.`,keywords:[`врач`,`клиника`,`записаться`,`лечение`,`дмс`,`дәрігер`]},{id:`dms-3`,point:`6.3`,heading:`Остаток лимита`,text:`Остаток лимита ДМС отображается в профиле сотрудника и обновляется ежедневно.`,keywords:[`лимит`,`остаток`,`дмс`]}]},{id:`aid`,code:`ВНД-HR-07`,title:`Положение о социальной поддержке работников`,owner:os,version:`2025-12-05`,access:`all`,status:`active`,sections:[{id:`aid-1`,point:`7.1`,heading:`Материальная помощь`,text:`Материальная помощь оказывается при рождении ребёнка, регистрации брака, смерти близкого родственника, а также при чрезвычайных ситуациях (пожар, стихийное бедствие).`,keywords:[`материальная помощь`,`матпомощь`,`помощь`,`выплата`,`материалдық көмек`]},{id:`aid-2`,point:`7.2`,heading:`Как подать заявление`,text:`Подайте заявление в портале в течение 6 месяцев с даты события. Документы из eGov подтягиваются автоматически, остальные можно приложить фото. Решение принимает комиссия в течение 10 рабочих дней.`,keywords:[`заявление`,`материальная помощь`,`документы`,`срок`]}]},{id:`remote`,code:`ВНД-HR-08`,title:`Порядок гибридной работы и права на отключение`,owner:os,version:`2026-04-01`,access:`all`,status:`active`,sections:[{id:`rem-1`,point:`8.1`,heading:`Гибридный формат`,text:`Сотрудникам, чья работа не связана с обслуживанием клиентов в отделениях, доступна дистанционная работа до 2 дней в неделю по согласованию с руководителем. Заявка подаётся в портале.`,keywords:[`удаленка`,`удаленно`,`дистанционно`,`из дома`,`гибрид`,`қашықтан`]},{id:`rem-2`,point:`8.2`,heading:`Гибкое начало дня`,text:`Начало рабочего дня можно сдвинуть в интервале с 8:00 до 10:00 при сохранении продолжительности рабочего дня.`,keywords:[`гибкий график`,`начало дня`,`опоздание`,`график работы`]},{id:`rem-3`,point:`8.3`,heading:`Право на отключение`,text:`Вне рабочего времени и в отпуске сотрудник не обязан отвечать на несрочные рабочие сообщения и звонки. Руководителям рекомендуется планировать отправку писем на рабочее время.`,keywords:[`после работы`,`вечером`,`выходные`,`переработка`,`сверхурочно`,`отключение`]}]},{id:`learn`,code:`ВНД-HR-09`,title:`Положение об обучении, развитии и внутренних переходах`,owner:`Корпоративный университет`,version:`2026-02-20`,access:`all`,status:`active`,sections:[{id:`learn-1`,point:`9.1`,heading:`Обязательное обучение и тесты`,text:`Ежегодно каждый сотрудник проходит обязательные курсы и тесты: информационная безопасность, ПОД/ФТ, деловая этика. Курсы и тесты проходят на платформе обучения — там же видны сроки и результаты.`,keywords:[`обязательное обучение`,`курсы`,`под/фт`,`иб`,`тест`,`оқу`]},{id:`learn-2`,point:`9.2`,heading:`Внешнее обучение`,text:`Внешние курсы, конференции и сертификации оплачиваются Банком в рамках бюджета подразделения на обучение. Заявка подаётся на платформе обучения и согласуется руководителем.`,keywords:[`обучение`,`курсы`,`сертификация`,`конференция`,`оплатит`,`тренинг`]},{id:`learn-3`,point:`9.3`,heading:`Внутренние вакансии`,text:`Откликнуться на внутреннюю вакансию можно после 1 года работы на текущей позиции. Ваш руководитель узнает об отклике только после того, как вы пройдёте первый этап отбора.`,keywords:[`вакансия`,`перевод`,`другой отдел`,`карьера`,`повышение`,`бос орын`]},{id:`learn-4`,point:`9.4`,heading:`Где проходить обучение и тесты`,text:`Каталог курсов, запись на обучение, тесты и сертификаты находятся на платформе обучения. HR-портал показывает ваши обязательные курсы и ведёт на платформу.`,keywords:[`заявка на обучение`,`записаться на курс`,`каталог`,`обучение`,`тест`,`тесты`,`тестирование`,`оқуға өтініш`]}]},{id:`resign`,code:`ВНД-HR-10`,title:`Порядок прекращения трудового договора`,owner:os,version:`2025-10-01`,access:`all`,status:`active`,sections:[{id:`res-1`,point:`10.1`,heading:`Увольнение по собственному желанию`,text:`Сотрудник уведомляет Банк письменно не менее чем за один месяц. Заявление подаётся в портале и подписывается ЭЦП. По соглашению сторон срок может быть сокращён.`,keywords:[`уволиться`,`увольнение`,`по собственному`,`уход`,`жұмыстан шығу`]},{id:`res-2`,point:`10.2`,heading:`Обходной лист и расчёт`,text:`Обходной лист формируется электронно. Окончательный расчёт, включая компенсацию за неиспользованный отпуск, производится в последний рабочий день.`,keywords:[`обходной`,`расчет при увольнении`,`увольнение`,`неиспользованный`]},{id:`res-3`,point:`10.3`,heading:`Передача дел, техника и доступы`,text:`До последнего дня проведите встречу по передаче дел с руководителем и коллегой-преемником и верните технику и пропуск. Доступы ко всем системам отключаются автоматически в 18:00 последнего рабочего дня — это требование информационной безопасности.`,keywords:[`передача дел`,`вернуть ноутбук`,`последний день`,`при увольнении`]},{id:`res-4`,point:`10.4`,heading:`Exit-интервью`,text:`Перед уходом сотруднику предлагается пройти exit-интервью. Участие добровольное. Ответы не передаются руководителю: HR видит причины ухода только в обобщённом виде по группам от 5 человек, цитаты — только с согласия.`,keywords:[`exit`,`интервью`,`опрос при увольнении`,`почему ухожу`,`выходное интервью`]},{id:`res-5`,point:`10.5`,heading:`Справки после увольнения`,text:`Справки о стаже и доходах можно заказать и после увольнения в течение 3 лет через HR-отдел. Бывшие сотрудники с положительной рекомендацией могут вернуться в Банк по упрощённой процедуре.`,keywords:[`после увольнения`,`справка`,`вернуться`,`бывший сотрудник`]}]},{id:`onb`,code:`ВНД-HR-11`,title:`Программа адаптации новых сотрудников`,owner:os,version:`2026-03-15`,access:`all`,status:`active`,sections:[{id:`onb-1`,point:`11.1`,heading:`Первый день`,text:`В первый день вы получаете доступы, корпоративный ноутбук и знакомитесь с наставником. План адаптации на 3 месяца появляется в портале.`,keywords:[`первый день`,`новичок`,`новый сотрудник`,`адаптация`,`жаңа`]},{id:`onb-2`,point:`11.2`,heading:`Испытательный срок`,text:`Испытательный срок составляет до 3 месяцев. По его итогам руководитель проводит встречу и фиксирует результат в портале.`,keywords:[`испытательный срок`,`испытательный`,`сынақ мерзімі`]},{id:`onb-3`,point:`11.3`,heading:`Наставник`,text:`В первую неделю руководитель назначает наставника из команды. Наставник проводит встречу-знакомство, затем еженедельные встречи 1-on-1 в первый месяц и встречи на 30, 60 и 90 день. Расписание появляется в разделе «Адаптация».`,keywords:[`наставник`,`бадди`,`ментор`,`кто поможет`,`тәлімгер`]},{id:`onb-4`,point:`11.4`,heading:`Пропуск, доступы и техника`,text:`Пропуск выдаёт служба безопасности в первый день по удостоверению личности. Доступы к рабочим системам заказывает руководитель до вашего выхода; если чего-то не хватает — создайте заявку в ИТ-поддержку через портал. Ноутбук выдаётся в первый день под подпись.`,keywords:[`пропуск`,`доступ`,`доступы`,`ноутбук`,`техника`,`ит-поддержка`,`почта`,`рұқсат`]},{id:`onb-5`,point:`11.5`,heading:`Встречи по испытательному сроку`,text:`На 30, 60 и 90 день руководитель проводит короткие встречи: что получается, где нужна помощь. По итогам 90 дня фиксируется решение о прохождении испытательного срока.`,keywords:[`испытательный срок`,`встреча`,`90 дней`,`итоги`,`оценка новичка`]}]},{id:`care`,code:`ВНД-HR-12`,title:`Программа заботы о благополучии сотрудников`,owner:os,version:`2026-06-01`,access:`all`,status:`active`,sections:[{id:`care-1`,point:`12.1`,heading:`Психологическая поддержка`,text:`Каждый сотрудник может бесплатно получить до 6 консультаций психолога в год. Запись анонимна: руководитель и HR не видят, кто обратился.`,keywords:[`психолог`,`стресс`,`тревога`,`поддержка`,`выгорание`,`устал`,`психолог көмегі`]},{id:`care-2`,point:`12.2`,heading:`Индекс нагрузки: какие данные используются`,text:`Индекс рассчитывается только по обезличенным метрикам времени: длина рабочего дня, активность после 19:00 и в выходные, доля встреч, перерывы, дни с последнего отпуска. Содержимое экрана, переписка, файлы и нажатия клавиш не собираются.`,keywords:[`индекс`,`выгорание`,`мониторинг`,`слежка`,`данные`,`метрики`,`что собирают`]},{id:`care-3`,point:`12.3`,heading:`Кто видит индекс`,text:`Личный индекс видит только сам сотрудник. Руководитель видит только средние показатели команды, если в ней не менее 5 человек. HR-партнёр видит персональный индекс только с письменного согласия сотрудника, которое можно отозвать в любой момент.`,keywords:[`кто видит`,`руководитель видит`,`конфиденциальность`,`индекс`,`согласие`,`приватность`]}]},{id:`otk`,code:`ВНД-HR-15`,title:`Порядок постановки и оценки годовых целей (ОТК)`,owner:os,version:`2026-01-10`,access:`all`,status:`active`,sections:[{id:`otk-1`,point:`15.1`,heading:`Где ставить и оценивать годовые цели`,text:`Годовые цели (ОТК) ставятся, согласуются с руководителем и оцениваются на отдельной платформе ОТК. HR-портал показывает ближайшие сроки и ведёт на платформу.`,keywords:[`отк`,`годовые цели`,`цели`,`kpi`,`кпи`,`оценка`,`годовая оценка`,`мақсат`]},{id:`otk-2`,point:`15.2`,heading:`Цикл ОТК`,text:`Постановка целей — в начале года, промежуточный обзор — в середине года, итоговая оценка — по итогам года. Точные даты публикуются на платформе ОТК.`,keywords:[`сроки отк`,`когда оценка`,`промежуточный обзор`,`итоговая оценка`,`отк`]}]},{id:`mgr`,code:`ВНД-HR-13`,title:`Регламент для руководителей: заявки и нагрузка команды`,owner:os,version:`2026-05-10`,access:`managers`,status:`active`,sections:[{id:`mgr-1`,point:`13.1`,heading:`Сроки согласования заявок`,text:`Руководитель согласует или отклоняет заявки сотрудников (отпуск, командировка, гибридная работа) в течение 2 рабочих дней. Отказ сопровождается комментарием.`,keywords:[`согласовать`,`согласование`,`одобрить`,`заявки сотрудников`,`срок`]},{id:`mgr-2`,point:`13.2`,heading:`Если нагрузка команды высокая`,text:`При уровне «Внимание» или «Высокий» по команде проведите встречи 1-on-1, пересмотрите распределение задач и не назначайте встречи после 18:00. Требовать от сотрудника показать личный индекс запрещено.`,keywords:[`нагрузка`,`выгорание команды`,`команда`,`индекс`,`1-on-1`,`перегрузка`]}]},{id:`hrp`,code:`ВНД-HR-14`,title:`Инструкция HR-партнёра по работе с обращениями`,owner:os,version:`2026-05-10`,access:`hr`,status:`active`,sections:[{id:`hrp-1`,point:`14.1`,heading:`Сроки ответа`,text:`Ответ на обращение, переданное ИИ-помощником, даётся в течение 1 рабочего дня. Если ответа нет в базе знаний, HR-партнёр создаёт статью или передаёт запрос владельцу ВНД.`,keywords:[`обращение`,`срок ответа`,`sla`,`база знаний`]},{id:`hrp-2`,point:`14.2`,heading:`Обращения о благополучии`,text:`Обращения, переданные с согласия сотрудника, конфиденциальны: их нельзя пересылать руководителю без отдельного согласия сотрудника.`,keywords:[`согласие`,`благополучие`,`конфиденциально`,`выгорание`]}]}],cs=[{id:`vacation`,title:`Ежегодный отпуск`,short:`Даты, остаток дней, перенос`,group:`Отпуска и отсутствия`,needsManager:!0,needsSign:!0,sla:`Согласование до 2 рабочих дней`,source:`vac-3`},{id:`unpaid`,title:`Отпуск без сохранения`,short:`Свадьба, рождение ребёнка, семейные обстоятельства`,group:`Отпуска и отсутствия`,needsManager:!0,needsSign:!0,sla:`Согласование до 2 рабочих дней`,source:`soc-1`},{id:`sick`,title:`Больничный`,short:`Сообщить о болезни команде и HR`,group:`Отпуска и отсутствия`,needsManager:!1,needsSign:!1,sla:`Сразу`,source:`sick-1`},{id:`trip`,title:`Командировка`,short:`Билеты, гостиница, суточные`,group:`Отпуска и отсутствия`,needsManager:!0,needsSign:!0,sla:`Не позднее 5 рабочих дней до поездки`,source:`trip-1`},{id:`certificate`,title:`Справка`,short:`С места работы, о доходах, для визы, о стаже`,group:`Документы`,needsManager:!1,needsSign:!1,sla:`Электронная — 1 минута`,source:`cert-1`},{id:`remote`,title:`Гибридная работа`,short:`До 2 дней в неделю из дома`,group:`Работа и развитие`,needsManager:!0,needsSign:!1,sla:`Согласование до 2 рабочих дней`,source:`rem-1`},{id:`otk`,title:`Годовые цели (ОТК)`,short:`Постановка и оценка целей — на платформе ОТК`,group:`Работа и развитие`,needsManager:!1,needsSign:!1,sla:`Отдельная платформа`,source:`otk-1`,platform:`otk`},{id:`training`,title:`Обучение и тесты`,short:`Курсы, тесты и заявки — на платформе обучения`,group:`Работа и развитие`,needsManager:!1,needsSign:!1,sla:`Отдельная платформа`,source:`learn-4`,platform:`learning`},{id:`transfer`,title:`Внутренние вакансии`,short:`Отклик конфиденциален до 1 этапа`,group:`Работа и развитие`,needsManager:!1,needsSign:!1,sla:`Ответ рекрутера до 5 рабочих дней`,source:`learn-3`},{id:`resign`,title:`Увольнение`,short:`Заявление, обходной лист, расчёт`,group:`Работа и развитие`,needsManager:!1,needsSign:!0,sla:`Уведомление за 1 месяц`,source:`res-1`},{id:`dms`,title:`ДМС`,short:`Полис, лимит, подключить семью`,group:`Здоровье и поддержка`,needsManager:!1,needsSign:!1,sla:`Подключение семьи — до 5 рабочих дней`,source:`dms-1`},{id:`aid`,title:`Материальная помощь`,short:`Рождение ребёнка, брак, утрата, ЧС`,group:`Здоровье и поддержка`,needsManager:!1,needsSign:!0,sla:`Решение комиссии до 10 рабочих дней`,source:`aid-2`},{id:`psych`,title:`Консультация психолога`,short:`Анонимно: руководитель и HR не узнают`,group:`Здоровье и поддержка`,needsManager:!1,needsSign:!1,sla:`Запись в течение 1 дня`,source:`care-1`}],ls=e=>cs.find(t=>t.id===e),us=[{id:`baby`,title:`У меня родился ребёнок`,emoji:`👶`,lead:`Поздравляем! Вот всё, что можно оформить — в одном месте.`,steps:[{text:`Сообщите руководителю — можно прямо из портала уведомлением.`},{text:`Оформите отпуск без сохранения заработной платы — до 5 календарных дней Банк обязан предоставить.`,source:`soc-1`,service:`unpaid`},{text:`Данные о ребёнке подтянутся из eGov — справку приносить не нужно.`,source:`soc-4`},{text:`Подайте заявление на материальную помощь — в течение 6 месяцев.`,source:`aid-2`,service:`aid`},{text:`Подключите ребёнка к ДМС по корпоративному тарифу.`,source:`dms-1`,service:`dms`},{text:`Если планируете отпуск по уходу за ребёнком — HR-партнёр поможет с документами.`,source:`soc-3`}]},{id:`sick`,title:`Я заболел`,emoji:`🤒`,lead:`Выздоравливайте. Бумажный больничный приносить не нужно.`,steps:[{text:`В первый день сообщите руководителю и отметьте больничный в портале.`,source:`sick-1`,service:`sick`},{text:`Больничный лист врач оформит электронно — он сам поступит в HR.`,source:`sick-2`},{text:`Для визита к врачу используйте ДМС.`,source:`dms-2`,service:`dms`},{text:`Пособие придёт с ближайшей зарплатой после закрытия больничного.`,source:`sick-3`}]},{id:`vacation`,title:`Планирую отпуск`,emoji:`🏖️`,lead:`Проверьте остаток дней и подайте заявку минимум за 14 дней.`,steps:[{text:`Посмотрите остаток дней — он указан на главной странице.`,source:`vac-1`},{text:`Подайте заявку не позднее чем за 14 календарных дней и подпишите ЭЦП.`,source:`vac-3`,service:`vacation`},{text:`Отпуск можно разделить на части — одна не короче 2 недель.`,source:`vac-4`},{text:`Отпускные придут не позднее чем за 3 дня до начала.`,source:`vac-5`}]},{id:`newbie`,title:`Я новый сотрудник`,emoji:`🌱`,lead:`Добро пожаловать в Halyk! Первые 3 месяца — по плану адаптации.`,steps:[{text:`Первый день: доступы, ноутбук,
